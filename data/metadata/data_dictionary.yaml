observation_schema:
  series_id:
    type: string
    description: Stable identifier for the measured series.
  entity:
    type: string
    description: Company ticker or macro-series identifier.
  observation_date:
    type: date
    description: Date the observation describes.
  period_end_date:
    type: date
    description: End date of the reported measurement period.
  available_date:
    type: date
    description: Earliest date the observation may enter a model.
  value:
    type: number
    description: Numeric observation value.
  unit:
    type: string
    description: Unit of measurement, such as USD or percent.
  frequency:
    type: string
    description: Observation frequency, such as quarterly, annual, or daily.
  source:
    type: string
    description: Provider and source series identifier.
  retrieved_at:
    type: datetime
    description: UTC timestamp when the source response was retrieved.

fundamental_fields:
  revenue: USD; reported revenue for the fiscal period.
  cost_of_revenue: USD; costs directly associated with reported revenue.
  gross_profit: USD; revenue less cost of revenue.
  operating_income: USD; income from operations.
  net_income: USD; income after expenses and taxes.
  diluted_eps: USD per share; diluted earnings per share.
  operating_cash_flow: USD; cash from operating activities.
  capital_expenditure: USD; cash capital expenditures.
  free_cash_flow: USD; operating cash flow less capital expenditures.
  cash: USD; cash and cash equivalents at period end.
  total_debt: USD; reported total debt.
  inventory: USD; inventory at period end.
  accounts_receivable: USD; accounts receivable at period end.
  diluted_shares: shares; diluted weighted-average shares outstanding.
  gross_margin: ratio; gross profit divided by revenue.
  operating_margin: ratio; operating income divided by revenue.
  free_cash_flow: USD; operating cash flow less capital expenditures.
  free_cash_flow_margin: ratio; free cash flow divided by revenue.
  total_debt: USD; current debt plus non-current debt.

industry_series:
  semiconductor_sales_proxy:
    source: FRED IPG3344S
    frequency: monthly
    units: seasonally adjusted index, 2017=100
    economic_interpretation: Industrial production for semiconductor and other electronic-component manufacturing.
    known_limitations: Measures U.S. industrial output, not global semiconductor sales or unit shipments.
  memory_pricing_proxy:
    source: FRED PCU334413334413
    frequency: monthly
    units: not-seasonally-adjusted index, December 1998=100
    economic_interpretation: Producer-price movement for semiconductor and related device manufacturing.
    known_limitations: Not DRAM- or HBM-specific and does not directly measure memory contract or spot prices.
  data_center_investment_proxy:
    source: FRED PNFIC1
    frequency: quarterly
    units: billions of chained 2017 dollars, seasonally adjusted annual rate
    economic_interpretation: U.S. real private nonresidential fixed investment, a broad proxy for infrastructure investment.
    known_limitations: Not data-center-specific; BEA GDP-release series and can move with unrelated private investment.
